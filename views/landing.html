<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traktir — Platform Dukungan untuk Kreator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0E0E10;--gold:#F2B84B;--text:#F4F4F5;--muted:#9A9AA3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:8px;}
  h1{font-size:32px;margin:18px 0 10px;}
  p{color:var(--muted);max-width:40ch;margin:0 auto 28px;}
  .btns{display:flex;gap:10px;justify-content:center;}
  a.btn{padding:12px 22px;border-radius:10px;font-weight:800;font-size:14px;}
  a.primary{background:var(--gold);color:#1A1200;}
  a.secondary{background:#18181B;border:1px solid rgba(255,255,255,0.15);color:var(--text);}
</style>
</head>
<body>
<div>
  <div><span class="dot"></span><b>Traktir</b></div>
  <h1>Kelola dukungan dari fansmu di satu tempat</h1>
  <p>Terima donasi lewat QRIS, e-wallet, dan bank transfer — lengkap dengan alert overlay untuk OBS.</p>
  <div class="btns">
    <a class="btn primary" href="/register">Buat Halaman</a>
    <a class="btn secondary" href="/login">Masuk</a>
  </div>
</div>
</body>
</html>
