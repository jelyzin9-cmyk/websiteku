<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Traktir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/dashboard.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .authcard{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;}
  .authcard h1{font-size:19px;margin:0 0 4px;}
  .authcard p{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .authcard .btn{width:100%;margin-top:18px;}
  .switch-link{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="authcard">
  <h1>Masuk ke Dashboard</h1>
  <p>Kelola halaman dukunganmu</p>
  <form id="loginForm">
    <label for="id">Email atau Username</label>
    <input type="text" id="id" required>
    <label for="pw">Password</label>
    <input type="password" id="pw" required>
    <button class="btn" type="submit">Masuk</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="switch-link">Belum punya akun? <a href="/register" style="color:var(--gold);">Daftar</a></div>
</div>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    msg.textContent = ""; msg.className = "msg";
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ emailOrUsername: document.getElementById("id").value, password: document.getElementById("pw").value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      window.location.href = "/dashboard";
    } catch (err) {
      msg.textContent = err.message || "Gagal masuk";
      msg.classList.add("err");
    }
  });
</script>
</body>
</html>
