<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Control — Traktir</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>
  <div>
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:12px;"><button class="menu-btn" id="menuBtn">☰</button><h1>Overlay Control</h1></div>
      <div style="display:flex;align-items:center;gap:12px;"><span class="userchip" id="userchip"></span><button class="logout-btn" id="logoutBtn">Keluar</button></div>
    </div>
    <div class="content">
      <div class="card">
        <h2>Batas Minimum Alert</h2>
        <p class="desc">Atur mulai dari jumlah berapa dukungan akan memicu alert di overlay.</p>
        <label for="minAlert">Minimal alert muncul (Rp)</label>
        <input type="number" id="minAlert" min="0" step="500">
        <label for="minTts">Minimal Text-to-speech (Rp)</label>
        <input type="number" id="minTts" min="0" step="500">
        <label for="alertDuration">Durasi alert tampil (detik)</label>
        <input type="number" id="alertDuration" min="2" max="30">
        <div class="toggle">
          <span>Aktifkan Text-to-speech</span>
          <div class="switch" id="ttsSwitch"></div>
        </div>
      </div>

      <div class="card">
        <h2>Mediashare — YouTube / TikTok</h2>
        <p class="desc">Pendukung bisa kirim link video yang akan diputar di overlay, dibayar per detik durasi.</p>
        <div class="toggle">
          <span>Aktifkan Mediashare</span>
          <div class="switch" id="mediaSwitch"></div>
        </div>
        <label for="platform">Platform</label>
        <select id="platform">
          <option value="youtube">YouTube / TikTok</option>
        </select>
        <label for="minMediashare">Minimal dukungan untuk mediashare (Rp)</label>
        <input type="number" id="minMediashare" min="1000" step="1000">
        <label for="coinsPerSecond">Koin per detik durasi video</label>
        <input type="number" id="coinsPerSecond" min="10" step="10">
        <button class="btn" id="saveBtn" style="margin-top:18px;">Simpan Pengaturan</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>
</div>
<script src="/assets/dashboard.js"></script>
<script>
  function bindSwitch(id, initial) {
    const el = document.getElementById(id);
    if (initial) el.classList.add("on");
    el.addEventListener("click", () => el.classList.toggle("on"));
  }
  async function load() {
    const res = await fetch("/api/dashboard/overlay-settings");
    const s = await res.json();
    document.getElementById("minAlert").value = s.min_alert;
    document.getElementById("minTts").value = s.min_tts;
    document.getElementById("alertDuration").value = s.alert_duration_seconds;
    document.getElementById("minMediashare").value = s.min_mediashare;
    document.getElementById("coinsPerSecond").value = s.coins_per_second;
    bindSwitch("ttsSwitch", !!s.tts_enabled);
    bindSwitch("mediaSwitch", !!s.mediashare_enabled);
  }
  document.getElementById("saveBtn").addEventListener("click", async () => {
    const msg = document.getElementById("msg"); msg.textContent = ""; msg.className = "msg";
    try {
      const res = await fetch("/api/dashboard/overlay-settings", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          minAlert: document.getElementById("minAlert").value,
          minTts: document.getElementById("minTts").value,
          alertDuration: document.getElementById("alertDuration").value,
          ttsEnabled: document.getElementById("ttsSwitch").classList.contains("on"),
          mediashareEnabled: document.getElementById("mediaSwitch").classList.contains("on"),
          mediasharePlatform: document.getElementById("platform").value,
          minMediashare: document.getElementById("minMediashare").value,
          coinsPerSecond: document.getElementById("coinsPerSecond").value,
        }),
      });
      if (!res.ok) throw new Error((await res.json()).error);
      msg.textContent = "Pengaturan tersimpan."; msg.classList.add("ok");
    } catch (err) { msg.textContent = err.message; msg.classList.add("err"); }
  });
  document.addEventListener("DOMContentLoaded", load);
</script>
</body>
</html>
