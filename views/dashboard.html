<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Support - WebsiteKu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d0f12; color: #c9d1d9; display: flex; min-height: 100vh; }
    .wrapper { display: flex; width: 100%; }
    .sidebar { width: 240px; background: #161b22; border-right: 1px solid #30363d; padding: 24px 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand { font-size: 20px; font-weight: 800; color: #f59e0b; margin-bottom: 32px; }
    .menu { list-style: none; }
    .menu li { margin-bottom: 8px; }
    .menu a { display: block; padding: 10px 14px; color: #8b949e; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; }
    .menu a.active, .menu a:hover { background: #21262d; color: #ffffff; }
    .btn-logout { display: block; padding: 10px; text-align: center; background: rgba(220, 38, 38, 0.15); color: #f87171; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600; }
    .main-content { flex: 1; padding: 32px; overflow-y: auto; }
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 24px; color: #fff; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; }
    .stat-card span { font-size: 12px; color: #8b949e; text-transform: uppercase; font-weight: 600; }
    .stat-card h2 { font-size: 24px; color: #f59e0b; margin-top: 6px; }
    .link-box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 32px; }
    .link-box label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 8px; }
    .link-input-group { display: flex; gap: 10px; }
    .link-input-group input { flex: 1; background: #0d1117; border: 1px solid #30363d; padding: 10px 14px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .btn-copy { background: #f59e0b; color: #0d0f12; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .table-container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 14px 20px; border-bottom: 1px solid #30363d; }
    th { background: #21262d; color: #8b949e; font-weight: 600; }
    @media (max-width: 768px) {
      .wrapper { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #30363d; }
      .main-content { padding: 16px; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="sidebar">
      <div>
        <div class="brand">🚀 WebsiteKu</div>
        <ul class="menu">
          <li><a href="/dashboard" class="active">Dashboard</a></li>
          <li><a href="/jelyzx">Halaman Donatur</a></li>
        </ul>
      </div>
      <a href="/logout" class="btn-logout">Logout</a>
    </div>

    <div class="main-content">
      <div class="header">
        <h1>Dashboard Dukungan</h1>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span>Total Saldo</span>
          <h2 id="totalSaldo">Rp 0</h2>
        </div>
        <div class="stat-card">
          <span>Total Dukungan</span>
          <h2 id="totalDonasi">0 Donasi</h2>
        </div>
      </div>

      <div class="link-box">
        <label>Link Halaman Dukunganmu:</label>
        <div class="link-input-group">
          <input type="text" id="shareLink" readonly>
          <button class="btn-copy" onclick="copyLink()">Salin Link</button>
        </div>
      </div>

      <h3>Dukungan Terbaru</h3>
      <br>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Pengirim</th>
              <th>Jumlah</th>
              <th>Pesan</th>
              <th>Tanggal</th>
            </tr>
          </thead>
          <tbody id="donationTable">
            <tr>
              <td colspan="4" style="text-align: center; color: #8b949e; padding: 24px;">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Set URL Donatur Sesuai Domain Aktif
    const currentHost = window.location.origin;
    document.getElementById('shareLink').value = `${currentHost}/jelyzx`;

    function copyLink() {
      const copyText = document.getElementById("shareLink");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Link donatur berhasil disalin!");
    }

    // Fetch Data Real-time dari Express Backend
    async function fetchDashboardData() {
      try {
        const res = await fetch('/api/donations');
        const data = await res.json();

        if (data.status === 'success') {
          document.getElementById('totalSaldo').innerText = `Rp ${data.totalSaldo.toLocaleString('id-ID')}`;
          document.getElementById('totalDonasi').innerText = `${data.totalDonasi} Donasi`;

          const tbody = document.getElementById('donationTable');
          if (data.list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #8b949e; padding: 24px;">Belum ada dukungan masuk.</td></tr>`;
          } else {
            tbody.innerHTML = data.list.map(item => `
              <tr>
                <td><strong>${item.sender}</strong></td>
                <td style="color: #f59e0b; font-weight: bold;">Rp ${item.amount.toLocaleString('id-ID')}</td>
                <td>${item.message}</td>
                <td>${item.date}</td>
              </tr>
            `).join('');
          }
        }
      } catch (err) {
        console.error("Gagal mengambil data dashboard:", err);
      }
    }

    fetchDashboardData();
  </script>
</body>
</html>
