<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Halaman Dukungan</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e1e1e; padding: 28px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #333; }
    h2 { margin: 0 0 6px 0; font-size: 22px; font-weight: bold; }
    p { margin: 0 0 24px 0; color: #aaa; font-size: 13px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; color: #ccc; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #f59e0b; }
    .hint { font-size: 11px; color: #888; margin-top: 5px; display: block; }
    button { width: 100%; padding: 12px; background: #f59e0b; border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 8px; }
    button:hover { background: #d97706; }
    .footer { text-align: center; margin-top: 20px; font-size: 13px; color: #aaa; }
    .footer a { color: #f59e0b; text-decoration: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Buat Halaman Dukungan</h2>
    <p>Gratis, siap terima donasi dalam beberapa menit</p>

    <form action="/register" method="POST" novalidate>
      
      <div class="form-group">
        <label>Nama Tampilan</label>
        <input type="text" name="name" placeholder="Jelyzx" required>
      </div>

      <div class="form-group">
        <label>Username (untuk link halamanmu)</label>
        <input type="text" name="username" placeholder="jelyzx" required>
        <span class="hint">*Gunakan huruf kecil/angka tanpa spasi</span>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="text" name="email" placeholder="nama@email.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit">Daftar</button>

    </form>

    <div class="footer">
      Sudah punya akun? <a href="/login">Masuk</a>
    </div>
  </div>

</body>
</html>
