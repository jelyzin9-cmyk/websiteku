<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — Traktir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/dashboard.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 0;}
  .authcard{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;}
  .authcard h1{font-size:19px;margin:0 0 4px;}
  .authcard p{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .authcard .btn{width:100%;margin-top:18px;}
  .switch-link{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="authcard">
  <h1>Buat Halaman Dukungan</h1>
  <p>Gratis, siap terima donasi dalam beberapa menit</p>
  <form id="regForm">
    <label for="displayName">Nama Tampilan</label>
    <input type="text" id="displayName" placeholder="Bintang Kartika" required>
    <label for="username">Username (untuk link halamanmu)</label>
    <input type="text" id="username" placeholder="bintang" required pattern="[a-z0-9_]{3,20}">
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" minlength="8" required>
    <button class="btn" type="submit">Daftar</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="switch-link">Sudah punya akun? <a href="/login" style="color:var(--gold);">Masuk</a></div>
</div>
<script>
  document.getElementById("regForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    msg.textContent = ""; msg.className = "msg";
    try {
      const res = await fetch("/api/auth/register", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          displayName: document.getElementById("displayName").value,
          username: document.getElementById("username").value.toLowerCase(),
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      window.location.href = "/dashboard";
    } catch (err) {
      msg.textContent = err.message || "Gagal daftar";
      msg.classList.add("err");
    }
  });
</script>
</body>
</html>
