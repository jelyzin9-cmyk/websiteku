<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Halaman Dukungan</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body class="bg-dark text-white">

  <div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card bg-gray-900 border-gray-800 p-4 style-card" style="max-width: 400px; width: 100%;">
      
      <h2 class="h4 font-weight-bold mb-1">Buat Halaman Dukungan</h2>
      <p class="text-muted small mb-4">Gratis, siap terima donasi dalam beberapa menit</p>

      <form action="/auth/register" method="POST">
        
        <!-- Nama Tampilan -->
        <div class="form-group mb-3">
          <label class="form-label small text-muted">Nama Tampilan</label>
          <input 
            type="text" 
            name="name" 
            class="form-control bg-dark border-gray-700 text-white" 
            placeholder="Jelyzx" 
            required
          >
        </div>

        <!-- Username -->
        <div class="form-group mb-3">
          <label class="form-label small text-muted">Username (untuk link halamanmu)</label>
          <input 
            type="text" 
            name="username" 
            class="form-control bg-dark border-gray-700 text-white" 
            placeholder="jelyzx" 
            pattern="[a-zA-Z0-9_-]+"
            title="Gunakan huruf, angka, atau tanda strip saja tanpa spasi" 
            required
          >
        </div>

        <!-- Email -->
        <div class="form-group mb-3">
          <label class="form-label small text-muted">Email</label>
          <input 
            type="email" 
            name="email" 
            class="form-control bg-dark border-gray-700 text-white" 
            placeholder="nama@email.com" 
            required
          >
        </div>

        <!-- Password -->
        <div class="form-group mb-4">
          <label class="form-label small text-muted">Password</label>
          <input 
            type="password" 
            name="password" 
            class="form-control bg-dark border-gray-700 text-white" 
            placeholder="••••••••" 
            minlength="6"
            required
          >
        </div>

        <!-- Tombol Daftar -->
        <button type="submit" class="btn btn-warning w-100 font-weight-bold py-2 mb-3">
          Daftar
        </button>

      </form>

      <div class="text-center small text-muted">
        Sudah punya akun? <a href="/login" class="text-warning">Masuk</a>
      </div>

    </div>
  </div>

</body>
</html>
