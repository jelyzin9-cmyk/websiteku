<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Transaksi — Traktir</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>
  <div>
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:12px;"><button class="menu-btn" id="menuBtn">☰</button><h1>Riwayat Transaksi</h1></div>
      <div style="display:flex;align-items:center;gap:12px;"><span class="userchip" id="userchip"></span><button class="logout-btn" id="logoutBtn">Keluar</button></div>
    </div>
    <div class="content">
      <div class="card">
        <h2>Semua Transaksi</h2>
        <div style="margin-bottom:14px;display:flex;gap:8px;">
          <select id="statusFilter" style="max-width:180px;">
            <option value="">Semua status</option>
            <option value="paid">Lunas</option>
            <option value="pending">Menunggu</option>
            <option value="failed">Gagal</option>
          </select>
        </div>
        <table id="txTable">
          <thead><tr><th>Nama</th><th>Jumlah</th><th>Metode</th><th>Status</th><th>Waktu</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="empty" id="empty" style="display:none;">Belum ada transaksi.</div>
      </div>
    </div>
  </div>
</div>
<script src="/assets/dashboard.js"></script>
<script>
  const fmt = v => "Rp " + v.toLocaleString("id-ID");
  const statusLabel = { paid: "Lunas", pending: "Menunggu", failed: "Gagal" };

  async function load() {
    const status = document.getElementById("statusFilter").value;
    const url = "/api/dashboard/transactions" + (status ? `?status=${status}` : "");
    const res = await fetch(url);
    const rows = await res.json();
    const tbody = document.querySelector("#txTable tbody");
    document.getElementById("empty").style.display = rows.length ? "none" : "block";
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>${r.donor_name}</td>
        <td>${fmt(r.amount)}</td>
        <td>${r.method}${r.submethod ? " · " + r.submethod : ""}</td>
        <td><span class="tag ${r.status}">${statusLabel[r.status] || r.status}</span></td>
        <td>${new Date(r.created_at).toLocaleString("id-ID")}</td>
      </tr>
    `).join("");
  }
  document.getElementById("statusFilter").addEventListener("change", load);
  document.addEventListener("DOMContentLoaded", load);
</script>
</body>
</html>
